# 장기 토큰 갱신: 매주 월요일 03:13(KST). 60일 만료 전에 늘 새로 고친다. 실패하면 빨간불 → GitHub 메일.
name: token-refresh

on:
  schedule:
    - cron: '13 18 * * 0'   # KST 월요일 03:13
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -q -r requirements.txt
      - env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python -m publisher.tokens refresh
