# 게시기: Notion 콘텐츠 캘린더의 '승인' 글을 Threads 공식 API로 올린다.
# 08:07·21:37 + 0~9분에 게시한다. GitHub 예약 실행은 늦거나 빠지기도 해서(10/28 아침 07:47 실행이 안 옴)
# 슬롯마다 20분 간격으로 5번 깨운다. 슬롯은 깬 시각으로 정한다(슬롯 55분 전 ~ 90분 뒤, 밖이면 그냥 끝).
# 이미 올린 글은 캘린더 '게시됨'·게시 링크와 계정 최근 글 대조로 다시 올리지 않는다.
# 예약 실행은 publisher/config.py의 LIVE가 True일 때만 올린다.
# dryrun/request.txt에 캘린더 행 ID를 적어 main에 올리면 그 행으로 드라이런만 돈다(게시 안 함).
# 끝나면 Pages를 저장소 상태(게시된 카드만)로 다시 공개해, 게시 안 된 카드는 내려간다.
name: publish

on:
  schedule:
    - cron: '13,33,53 22 * * *'   # KST 07:13 07:33 07:53 → 08:07 슬롯
    - cron: '13,33 23 * * *'      # KST 08:13 08:33 (늦은 실행 대비)
    - cron: '43 11 * * *'         # KST 20:43 → 21:37 슬롯
    - cron: '3,23,43 12 * * *'    # KST 21:03 21:23 21:43
    - cron: '3 13 * * *'          # KST 22:03 (늦은 실행 대비)
  push:
    branches: [main]
    paths: ['dryrun/request.txt']
  workflow_dispatch:
    inputs:
      slot:
        description: '슬롯'
        type: choice
        options: ['08:07', '21:37']
        default: '08:07'
      page_id:
        description: '시험용: 이 캘린더 행만 올림 (비우면 평소대로 고름)'
        type: string
        default: ''
      dry_run:
        description: '드라이런: 검사·카드·컨테이너까지만, 게시 안 함'
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      has_post: ${{ steps.p.outputs.has_post }}
      key: ${{ steps.p.outputs.key }}
      notices: ${{ steps.p.outputs.notices }}
      dry: ${{ steps.s.outputs.dry }}
      manual: ${{ steps.s.outputs.manual }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -q -r requirements.txt
      - id: s
        name: 슬롯·대상·드라이런 정하기
        env:
          EVENT: ${{ github.event_name }}
          SCHED: ${{ github.event.schedule }}
          IN_SLOT: ${{ inputs.slot }}
          IN_PAGE: ${{ inputs.page_id }}
          IN_DRY: ${{ inputs.dry_run }}
        run: |
          page=""; dry=false; manual=false
          if [ "$EVENT" = "workflow_dispatch" ]; then
            slot="$IN_SLOT"; page="$IN_PAGE"; dry="$IN_DRY"; manual=true
          elif [ "$EVENT" = "push" ]; then
            slot="08:07"; page="$(tr -d ' \r\n' < dryrun/request.txt)"; dry=true; manual=true
          else slot="auto"; fi
          { echo "slot=$slot"; echo "page=$page"; echo "dry=$dry"; echo "manual=$manual"; } >> "$GITHUB_OUTPUT"
          echo "슬롯 $slot · 대상 ${page:-자동} · 드라이런 $dry"
      - id: p
        name: 올릴 글 고르기 · 형식 검사 · 카드 받기
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          SLOT: ${{ steps.s.outputs.slot }}
          PAGE_ID: ${{ steps.s.outputs.page }}
          DRY: ${{ steps.s.outputs.dry }}
        run: |
          args=(--slot "$SLOT")
          if [ -n "$PAGE_ID" ]; then args+=(--page-id "$PAGE_ID"); fi
          if [ "$DRY" = "true" ]; then args+=(--dry-run); fi
          python -m publisher.cli prepare "${args[@]}"
      - name: 준비물 넘기기
        if: steps.p.outputs.has_post == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: staged
          path: staged/
          retention-days: 3
      - name: 알림 내용
        if: always()
        run: if [ -s notices.txt ]; then cat notices.txt; fi

  pages:
    needs: prepare
    if: needs.prepare.outputs.has_post == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    outputs:
      page_url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: staged
          path: staged/
      - run: pip install -q -r requirements.txt
      - run: python -m publisher.cli build-site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: d
        uses: actions/deploy-pages@v5

  post:
    needs: [prepare, pages]
    if: needs.prepare.outputs.has_post == 'true' && needs.pages.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -q -r requirements.txt
      - uses: actions/download-artifact@v8
        with:
          name: staged
          path: staged/
      - id: post
        name: 기다렸다가 게시 · 첫 답글 · Notion 기록
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          KEY: ${{ needs.prepare.outputs.key }}
          PAGES_URL: ${{ needs.pages.outputs.page_url }}
          DRY: ${{ needs.prepare.outputs.dry }}
          MANUAL: ${{ needs.prepare.outputs.manual }}
        run: |
          args=(--key "$KEY" --pages-url "$PAGES_URL")
          if [ "$DRY" = "true" ]; then args+=(--dry-run); fi
          if [ "$MANUAL" = "true" ]; then args+=(--now); fi
          python -m publisher.cli post "${args[@]}"
      - name: 원장 커밋 (게시된 글과 카드만)
        if: always()
        run: |
          if [ -z "$(git status --porcelain posts/)" ]; then echo "커밋할 것 없음"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts/
          git commit -m "게시 기록: ${{ needs.prepare.outputs.key }}"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
      - name: 알림 확인
        if: always()
        run: |
          if [ -s notices.txt ]; then cat notices.txt; echo "::error title=게시기 알림::Notion 그 글 행의 댓글을 확인하세요"; exit 1; fi

  tidy:
    name: Pages 정리 (게시된 카드만 남김)
    needs: [prepare, pages, post]
    if: always() && needs.pages.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -q -r requirements.txt
      - run: python -m publisher.cli build-site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-tidy
          path: _site
      - uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-tidy

  report:
    needs: [prepare, pages, post]
    if: always() && needs.prepare.outputs.notices == 'true'
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "::error title=게시기 알림::준비 단계에서 알릴 일이 생겼다. Notion 그 글 행의 댓글을 확인하세요"
          exit 1
