# 연결 확인: Threads 계정·한도·팔로워, Notion 두 데이터베이스의 칸과 행 수, Secrets가 있는지.
# 결과는 실행 요약과 주석(annotation)으로 남는다. 토큰 값은 찍지 않는다.
# 게시기 코드가 바뀌어 main에 올라오면 저절로 한 번 돈다.
name: verify

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['publisher/**', '.github/workflows/verify.yml', 'requirements.txt']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -q -r requirements.txt
      - name: 시험
        run: python -m unittest discover -s tests -t .
      - name: 연결 확인
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          THREADS_APP_ID: ${{ secrets.THREADS_APP_ID }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
        run: python -m publisher.cli verify
