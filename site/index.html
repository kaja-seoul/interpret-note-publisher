<html lang="ko">

<title>카드 이미지</title>

  body { margin:0; background:var(--bg); color:var(--ink); font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 48px 16px; }
  p { color: var(--quiet); }
</style>
</head>
<body>
<main>
  <h1>카드 이미지 저장소</h1>

</html>
